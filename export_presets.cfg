[preset.0]
name="Linux QA"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="data/brand/*.json,data/narrative/*.json,data/narrative/locales/*.json,data/campaign/*.json,data/legacy/*.json,data/alpha/*.json,data/card_system/*.json"
exclude_filter="work/*,tests/*,docs/*,tools/*,node_modules/*,.git/*"
export_path="work/build/nachtsiegel.x86_64"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Web QA"
platform="Web"
runnable=true
export_filter="all_resources"
