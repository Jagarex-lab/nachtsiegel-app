name: Native debug platforms (no deployment)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PLATFORMS_KEEP_BINARIES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's historical default includes the retired SDK 'tools'.
          packages: platform-tools
      - name: Install the pinned debug Android toolchain
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import actual project resources
        run: godot --headless --editor --import --path . --quit
      - name: Orchestrator, native package parser and evidence guards
        run: python3 -m unittest discover -s tests -p 'platform_qa_test.py' -v
      - name: Export Linux, run the actual exported duel, and verify Android APK
        run: tools/build_platform_qa.sh --platform linux-android
      - name: Preserve actual platform binaries and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orafold-linux-android-debug-${{ github.sha }}
          path: |
            work/production/platforms/results.json
            work/production/platforms/run-*/*.json
            work/production/platforms/run-*/*.log
            work/production/platforms/run-*/*.x86_64
            work/production/platforms/run-*/*.sh
            work/production/platforms/run-*/*.apk
          if-no-files-found: warn

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PLATFORMS_KEEP_BINARIES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Resolve the installed native Windows console executable
        run: |
          # setup-godot's extensionless hardlink works in PowerShell, but is
          # not resolved by Python/CreateProcess. Its official console binary
          # also waits for the real editor and preserves its logs/exit status.
          $engine = Join-Path $env:USERPROFILE 'godot/Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) {
            throw "The pinned native Godot console executable is missing"
          }
          "GODOT_BIN=$engine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import actual project resources
        run: |
          & $env:GODOT_BIN --headless --editor --import --path . --quit
          exit $LASTEXITCODE
      - name: Orchestrator, native package parser and evidence guards
        run: python -m unittest discover -s tests -p 'platform_qa_test.py' -v
      - name: Export real PE64 packages and execute the native Windows duel
        run: python tools/platform_qa.py --platform windows
      - name: Preserve actual Windows executables and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orafold-windows-debug-${{ github.sha }}
          path: |
            work/production/platforms/results.json
            work/production/platforms/run-*/*.json
            work/production/platforms/run-*/*.log
            work/production/platforms/run-*/*.exe
            work/production/platforms/run-*/*.dll
          if-no-files-found: warn
