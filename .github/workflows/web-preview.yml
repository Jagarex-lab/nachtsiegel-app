name: NACHTSIEGEL Arena QA

on:
  push:
    branches: [develop, 'feature/arena-quality']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nachtsiegel-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and matching templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Rules, real GUI input, landscape layout and render tests
        run: xvfb-run -a -s '-screen 0 1600x1000x24' tools/test.sh
      - name: Export tested browser build
        run: |
          mkdir -p work/build/web
          godot --headless --path . --export-debug 'Web QA' work/build/web/index.html
          test -s work/build/web/index.wasm
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser startup and touch smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory work/build/web > work/http.log 2>&1 &
          node tools/browser_qa.cjs
      - name: Preserve QA evidence and browser build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nachtsiegel-arena-qa
          path: |
            work/*final.log
            work/browser*.log
            work/browser-results.json
            work/*.png
            work/build/web/
          if-no-files-found: warn
# QA artifacts only. No Pages, store release or production deployment.
