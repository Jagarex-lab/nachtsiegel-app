name: NACHTSIEGEL Test and Publish

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nachtsiegel-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and matching templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendered contrast checker
        run: python3 -m pip install 'Pillow>=11,<14'
      - name: Rules, real GUI input, landscape layout and render tests
        run: xvfb-run -a -s '-screen 0 1600x1000x24' tools/test.sh
      - name: Export tested browser build
        run: |
          mkdir -p work/build/web
          game_name="nachtsiegel-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-debug 'Web QA' "work/build/web/$game_name.html"
          mv "work/build/web/$game_name.html" work/build/web/index.html
          test -s "work/build/web/$game_name.wasm"
          python3 - <<'PYINFO'
          import json, os
          from pathlib import Path
          Path('work/build/web/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'channel': os.environ['GITHUB_REF_NAME'],
          }, indent=2))
          PYINFO
      - name: Verify localized data inside the exported package
        run: |
          game_name="nachtsiegel-${GITHUB_SHA:0:12}"
          godot --headless --main-pack "work/build/web/$game_name.pck" --script "$PWD/tests/narrative.gd" --quit-after 120 > work/exported-narrative-final.log 2>&1
          python3 - <<'PYCHECK'
          import re
          from pathlib import Path
          log = Path('work/exported-narrative-final.log').read_text()
          assert not re.search(r'SCRIPT ERROR|^ERROR:|^FAIL:', log, re.M), log
          assert re.search(r'NARRATIVE: \d+ assertions, 0 failures', log), log
          print(log)
          PYCHECK
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
      - name: Browser startup and touch smoke test
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory work/build/web > work/http.log 2>&1 &
          node tools/browser_qa.cjs
      - name: Preserve QA evidence and browser build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nachtsiegel-arena-qa
          path: |
            work/*final.log
            work/browser*.log
            work/browser-results.json
            work/*.png
            work/build/web/
            work/ux/*.png
            work/ux/*.json
          if-no-files-found: warn
      - name: Upload checked Pages build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v3
        with:
          path: work/build/web/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: test-and-export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: nachtsiegel-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked game
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Install live browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify public game and touch input
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}?v=${{ github.sha }}
          EXPECTED_COMMIT: ${{ github.sha }}
          QA_PREFIX: live
        run: |
          mkdir -p work
          node tools/browser_qa.cjs
      - name: Preserve public game verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nachtsiegel-live-qa
          path: |
            work/live-*.png
            work/live-results.json
          if-no-files-found: warn
