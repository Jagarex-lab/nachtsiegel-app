name: NACHTSIEGEL CI (no deployment)

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop, 'production/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nachtsiegel-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platforms:
    # Part of this workflow's conclusion: a failed native build cannot be
    # hidden behind a green release-candidate run. No publication happens here.
    uses: ./.github/workflows/native-platform-qa.yml

  test-and-export:
    runs-on: ubuntu-24.04
    # Native regression suites and three exports; browser engines run separately.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and matching templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendered contrast checker
        run: python3 -m pip install 'Pillow>=11,<14'
      - name: Rules, real GUI input, landscape layout and render tests
        run: xvfb-run -a -s '-screen 0 1600x1000x24' tools/test.sh
      - name: Complete pinned Legacy and new Alpha regressions
        run: |
          tools/test_legacy.sh
          xvfb-run -a -s '-screen 0 1600x1000x24' tools/test_alpha.sh
          xvfb-run -a -s '-screen 0 1600x1200x24' tools/test_master550.sh
          tools/test_master550_resources.sh
          xvfb-run -a -s '-screen 0 1600x1200x24' tools/test_production.sh
      - name: Export archive regression build
        run: |
          mkdir -p work/build/archive-web
          game_name="nachtsiegel-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-debug 'Archive Web QA' "work/build/archive-web/$game_name.html"
          mv "work/build/archive-web/$game_name.html" work/build/archive-web/index.html
          test -s "work/build/archive-web/$game_name.wasm"
          mkdir -p work/build/archive-web/media
          cp docs/combat/gameplay.mp4 work/build/archive-web/media/gameplay.mp4
          python3 - <<'PYINFO'
          import json, os
          from pathlib import Path
          Path('work/build/archive-web/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'channel': os.environ['GITHUB_REF_NAME'],
          }, indent=2))
          PYINFO
      - name: Verify localized data inside the exported package
        run: |
          game_name="nachtsiegel-${GITHUB_SHA:0:12}"
          mkdir -p work/isolated-pack-context
          godot --headless --path "$PWD/work/isolated-pack-context" --main-pack "$PWD/work/build/archive-web/$game_name.pck" --script "$PWD/tests/narrative.gd" --quit-after 120 > work/exported-narrative-final.log 2>&1
          python3 - <<'PYCHECK'
          import re
          from pathlib import Path
          log = Path('work/exported-narrative-final.log').read_text()
          assert not re.search(r'SCRIPT ERROR|^ERROR:|^FAIL:', log, re.M), log
          assert re.search(r'NARRATIVE: \d+ assertions, 0 failures', log), log
          print(log)
          PYCHECK
      - name: Verify campaign foundation in the exported package
        run: |
          game_name="nachtsiegel-${GITHUB_SHA:0:12}"
          mkdir -p work/isolated-pack-context
          godot --headless --path "$PWD/work/isolated-pack-context" --main-pack "$PWD/work/build/archive-web/$game_name.pck" --script "$PWD/tests/exported_experience.gd" --quit-after 120 > work/exported-experience-final.log 2>&1
          python3 - <<'PYCHECK'
          import re
          from pathlib import Path
          log = Path('work/exported-experience-final.log').read_text()
          assert not re.search(r'SCRIPT ERROR|^ERROR:|^FAIL:', log, re.M), log
          assert 'entry scene; 0 failures' in log, log
          print(log)
          PYCHECK
      - name: Export Alpha candidate and Legacy UI regression build
        run: |
          tools/build_alpha.sh
          tools/build_legacy_ui_qa.sh
          mv work/alpha/web work/build/web
          python3 - <<'PYBUILDS'
          import json, os
          from pathlib import Path
          for folder in ('work/build/web', 'work/build/archive-web', 'work/alpha/legacy-web'):
              root = Path(folder)
              assert (root / 'index.html').is_file(), folder
              info = json.loads((root / 'build-info.json').read_text())
              assert info['commit'] == os.environ['GITHUB_SHA'], (folder, info)
          PYBUILDS
      - name: Export pinned previous runtime for same-origin storage migration
        run: tools/build_migration_baseline.sh
      - name: Preserve native QA evidence and single release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nachtsiegel-arena-qa
          path: |
            work/*final.log
            work/browser*.log
            work/browser-results.json
            work/*.png
            work/build/web/
            work/build/archive-web/
            work/alpha/legacy-web/
            work/legacy/*.log
            work/alpha/*.log
            work/alpha/*.json
            work/alpha/*.png
            work/alpha02/*.log
            work/alpha02/*.json
            work/alpha02/*.png
            work/master550/
            work/production/
            work/production-storage/native.log
            work/ux/*.png
            work/ux/*.json
            work/experience/*.png
            work/experience/*.log
            work/combat/*.json
            work/combat/*.log
          if-no-files-found: warn

  browser:
    needs: test-and-export
    runs-on: ubuntu-24.04
    # Full archive/Alpha/mobile/Master suites per engine, with WebGL startup and
    # reloads; independent workers remove the former sequential-engine deadline.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
      QA_ENGINES: ${{ matrix.engine }}
      GAME_URL: http://127.0.0.1:8788/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact native-tested builds
        uses: actions/download-artifact@v4
        with:
          name: nachtsiegel-arena-qa
          path: work
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Serve the three tested builds
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory work/build/archive-web > work/http.log 2>&1 &
          python3 -m http.server 8788 --bind 127.0.0.1 --directory work/build/web > work/alpha/http.log 2>&1 &
          python3 -m http.server 8787 --bind 127.0.0.1 --directory work/alpha/legacy-web > work/alpha/legacy-http.log 2>&1 &
          python3 tools/wait_http.py http://127.0.0.1:8765/build-info.json
          python3 tools/wait_http.py http://127.0.0.1:8788/build-info.json
          python3 tools/wait_http.py http://127.0.0.1:8787/build-info.json
      - name: Archive tutorial, saved reload and collection browser regression
        env:
          GAME_URL: http://127.0.0.1:8765/
        run: node tools/browser_qa.cjs
      - name: Complete Alpha browser duels and replay
        run: node tools/alpha_browser_qa.cjs
      - name: Mobile orientation, Retina and deckbuilder browser regression
        run: node tools/alpha02_browser_qa.cjs
      - name: Actual previous-version upgrade, stale-tab write and storage quota regression
        env:
          MIGRATION_OLD_BUILD: work/production/before-web
          MIGRATION_NEW_BUILD: work/build/web
        run: node tools/production/browser_migration_qa.cjs
      - name: Master card system and battlefield opening browser regression
        run: node tools/master550_browser_qa.cjs
      - name: Legacy UI Android regression
        if: matrix.engine == 'chromium'
        env:
          QA_ENGINES: chromium
          QA_PROFILES: android
          QA_LEGACY_ONLY: '1'
          GAME_URL: http://127.0.0.1:8787/
        run: |
          # Legacy uses the same harness filenames; retain the Alpha evidence.
          mkdir -p work/alpha/main-browser
          cp work/alpha/browser-results.json work/alpha/main-browser/browser-results.json
          for screenshot in work/alpha/chromium-android-*.png; do
            test ! -f "$screenshot" || mv "$screenshot" work/alpha/main-browser/
          done
          node tools/alpha_browser_qa.cjs > work/alpha/legacy-browser.log 2>&1
          mv work/alpha/browser-results.json work/alpha/legacy-browser-results.json
          cp work/alpha/main-browser/browser-results.json work/alpha/browser-results.json
      - name: Preserve engine-specific browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nachtsiegel-browser-${{ matrix.engine }}
          path: |
            work/web-*.png
            work/web-*.json
            work/browser-results.json
            work/http.log
            work/alpha/http.log
            work/alpha/legacy-http.log
            work/alpha/legacy-browser.log
            work/alpha/legacy-browser-results.json
            work/alpha/browser-*.json
            work/alpha/${{ matrix.engine }}-*.png
            work/alpha/main-browser/
            work/alpha02/${{ matrix.engine }}-*.png
            work/alpha02/${{ matrix.engine }}-*.json
            work/alpha02/browser-results.json
            work/master550/browser/
            work/production-browser-migration/
          if-no-files-found: warn

  production-resources:
    # Independent headless experiment; does not extend the native GUI/export job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The report verifies the pre-seam baseline against its recorded commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import scripts for the headless resource comparison
        run: |
          mkdir -p work/production
          godot --headless --editor --import --path . --audio-driver Dummy --quit > work/production/resource-import.log 2>&1
      - name: Complete 192 paired starter games and 10 controls
        run: bash tools/test_production_resources.sh
      - name: Validate source binding and negative evidence guards
        run: |
          python3 tools/production/report_resources.py --verify-rejections --output-dir work/production/resource-report
          python3 tools/production/report_resources.py --verify-rejections --output-dir work/production/resource-report --check
      - name: Preserve actual resource comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orafold-production-resources
          path: |
            work/production/resource-import.log
            work/production/resource-models.log
            work/production/resource-models.json
            work/production/resource-report/
          if-no-files-found: error

  production-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import production data scripts
        run: godot --headless --editor --import --path . --quit
      - name: Complete paired production strategy and starter matches
        run: tools/test_production_simulations.sh --shard=${{ matrix.shard }}/4
      - name: Preserve complete simulation metrics and limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orafold-production-balance-${{ matrix.shard }}
          path: |
            work/production/simulations-shard-${{ matrix.shard }}-of-4.log
            work/production/simulations-shard-${{ matrix.shard }}-of-4.json
          if-no-files-found: error

  production-balance-aggregate:
    needs: production-balance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all four real simulation shards
        uses: actions/download-artifact@v4
        with:
          pattern: orafold-production-balance-*
          path: work/production/shards
      - name: Verify disjoint coverage, all 848 real results and matching sources
        run: python3 tools/production/aggregate_simulations.py --verify-rejections work/production/shards/*/simulations-shard-*-of-4.json
      - name: Write actual balance report
        run: python3 tools/production/report_simulations.py
      - name: Preserve complete verified production matrix
        uses: actions/upload-artifact@v4
        with:
          name: orafold-production-full-matrix
          path: |
            work/production/simulations.json
            docs/production/BALANCE_REPORT.md
          if-no-files-found: error
