name: Godot Web Preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nachtsiegel-pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Import Godot project and validate scripts
        run: godot --headless --path . --editor --quit
      - name: Smoke-test arena startup and reject script errors
        run: |
          set -o pipefail
          timeout 25s godot --headless --path . --quit-after 8 2>&1 | tee /tmp/nachtsiegel-start.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Parser Error|Invalid get index|Invalid call" /tmp/nachtsiegel-start.log; then
            echo "Arena startup reported errors"
            exit 1
          fi
          # The headless dummy renderer can log a null-mesh ERROR for 3D objects.
          # It is not a GDScript parse failure; browser WebGL rendering is separate.
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          python3 tools/inject_web_diagnostics.py
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: nachtsiegel-web-preview
          path: build/web/
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
