<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	min-width: 0;
	overflow: hidden;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	position: fixed;
	inset: 0;
	/* Godot writes an inline pixel size. It must not expand the mobile
	   layout viewport after a landscape-to-portrait transition. */
	width: var(--game-width, 100vw) !important;
	max-width: 100%;
	height: var(--game-height, 100dvh) !important;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas" aria-label="$GODOT_PROJECT_NAME Fantasy-Kartenduell">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Request an antialiased default framebuffer. Emscripten then presents its
// offscreen canvas through its supported textured-quad path, avoiding a
// WebKit glBlitFramebuffer read/write attachment error. Godot owns scene AA.
const gameCanvas = document.getElementById('canvas');
// Godot 4.6 Web currently maps both DOM touchend and touchcancel to release
// type 1. Preserve cancellation synchronously in the capture phase, before
// Godot's canvas handler can turn a canceled drag into a card play.
window.orafoldTouchCancelVersion = 0;
function cancelGamePointer() {
 window.orafoldTouchCancelVersion += 1;
}
window.addEventListener('touchcancel',cancelGamePointer,{capture:true,passive:true});
window.addEventListener('pointercancel',cancelGamePointer,{capture:true,passive:true});
window.addEventListener('blur',cancelGamePointer,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelGamePointer();},{capture:true});
const createGameContext = gameCanvas.getContext.bind(gameCanvas);
gameCanvas.getContext = function(kind, options) {
 return createGameContext(kind, kind === 'webgl2' ? {...options, antialias:true} : options);
};
window.nachtsiegelInsets = function() {
 const probe = document.createElement('div');
 probe.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
 document.body.appendChild(probe);
 const style = getComputedStyle(probe);
 const result = {top:parseFloat(style.paddingTop)||0,right:parseFloat(style.paddingRight)||0,bottom:parseFloat(style.paddingBottom)||0,left:parseFloat(style.paddingLeft)||0};
 probe.remove();
 return result;
};
// ORAFOLD_VIEWPORT_BEGIN: shared by the browser regression harness.
let viewportSnapshot = null;
let viewportSignature = '';
let viewportTimers = [];
let viewportFrame = 0;
let notifyingGameResize = false;
let unoccludedViewport = null;
const positiveViewportNumber = (value, fallback) => Number.isFinite(value) && value > 0 ? value : fallback;
function syncGameViewport(notifyEngine = false) {
 const width = positiveViewportNumber(window.innerWidth, document.documentElement.clientWidth || 1);
 const height = positiveViewportNumber(window.innerHeight, document.documentElement.clientHeight || 1);
 const editable = document.activeElement?.matches('input,textarea,[contenteditable="true"]');
 // A keyboard may shrink the layout viewport too. Preserve its orientation
 // while the same-width editable view is occluded; a real turn changes width.
 if (!editable || !unoccludedViewport || Math.abs(width - unoccludedViewport.width) > 2) unoccludedViewport = {width,height};
 const orientation = editable && unoccludedViewport ? unoccludedViewport : {width,height};
 const style = document.documentElement.style;
 const canvasChanged = style.getPropertyValue('--game-width') !== width+'px' || style.getPropertyValue('--game-height') !== height+'px';
 style.setProperty('--game-width',width+'px');
 style.setProperty('--game-height',height+'px');
 const visual = window.visualViewport;
 const zoom = positiveViewportNumber(visual?.scale,1);
 // Safari can briefly expose the old visual viewport after the layout has
 // turned. Width * scale must match before its height/offsets are usable.
 const visualValid = !!visual && Number.isFinite(visual.width) && visual.width > 0 && Number.isFinite(visual.height) && visual.height > 0 &&
  Math.abs(visual.width * zoom - width) <= Math.max(4,width*.025) && visual.height <= height + 4;
 const left = visualValid ? Math.max(0,Math.min(width,Number(visual.offsetLeft)||0)) : 0;
 const top = visualValid ? Math.max(0,Math.min(height,Number(visual.offsetTop)||0)) : 0;
 const canvas = gameCanvas.getBoundingClientRect();
 viewportSnapshot = {width,height,portrait:orientation.height > orientation.width,
  canvasWidth:canvas.width,canvasHeight:canvas.height,
  visibleLeft:left,visibleTop:top,visibleWidth:visualValid ? Math.min(width-left,visual.width) : width,
  visibleHeight:visualValid ? Math.min(height-top,visual.height) : height,
  zoom,visualValid,insets:window.nachtsiegelInsets()};
 const signature = JSON.stringify(viewportSnapshot);
 if (signature !== viewportSignature) {
  viewportSignature = signature;
  window.orafoldViewportVersion = (window.orafoldViewportVersion || 0) + 1;
 }
 // Delayed Safari changes need to wake Godot's canvas policy as well as the
 // UI. The guard prevents our synthetic resize from starting another retry.
 if (notifyEngine && canvasChanged) {
  notifyingGameResize = true;
  window.dispatchEvent(new Event('resize'));
  notifyingGameResize = false;
 }
 return viewportSnapshot;
}
function settleGameViewport() {
 if (notifyingGameResize) return;
 syncGameViewport(true);
 cancelAnimationFrame(viewportFrame);
 viewportTimers.forEach(clearTimeout);
 viewportFrame = requestAnimationFrame(() => syncGameViewport(true));
 // iOS does not guarantee a final resize after orientationchange. Retry for
 // a bounded period, including toolbar and safe-area settling after resume.
 viewportTimers = [50,150,300,600,1000,1600].map(delay => setTimeout(() => syncGameViewport(true),delay));
}
window.orafoldViewportMetrics = () => viewportSnapshot || syncGameViewport();
settleGameViewport();
if(window.visualViewport) {
 window.visualViewport.addEventListener('resize',settleGameViewport);
 window.visualViewport.addEventListener('scroll',settleGameViewport);
}
window.addEventListener('resize',settleGameViewport);
window.addEventListener('orientationchange',settleGameViewport);
window.addEventListener('pageshow',settleGameViewport);
document.addEventListener('focusin',settleGameViewport);
document.addEventListener('focusout',settleGameViewport);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)settleGameViewport();});
// ORAFOLD_VIEWPORT_END
// Diagnostic measurements, not an orientation lock or rotated canvas.
window.orafoldDisplayMetrics=()=>{const c=document.querySelector('canvas'),r=c.getBoundingClientRect();return {cssWidth:r.width,cssHeight:r.height,pixelsWidth:c.width,pixelsHeight:c.height,dpr:window.devicePixelRatio||1,zoom:window.visualViewport?.scale||1,visibleHeight:window.visualViewport?.height||innerHeight,lockAvailable:typeof screen.orientation?.lock==='function'};};
</script>
<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
